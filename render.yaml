# Render Blueprint: backend (FastAPI). Put this file at the REPO ROOT.
# Demo configuration (development mode, hash embeddings, fake LLM). NOT for real production.
services:
  - type: web
    name: content-anchor-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install ".[server]"
    startCommand: python -m uvicorn nova.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NOVA_ENV
        value: development
      - key: NOVA_EMBEDDER
        value: hash
      - key: NOVA_ALLOW_FAKE_LLM
        value: "true"
      - key: NOVA_DB_PATH
        value: nova.db
      - key: NOVA_CONTROL_DB_PATH
        value: nova_control.db
      - key: NOVA_ALLOW_PRIVATE_ENDPOINTS
        value: "false"
    # Free tier disk is ephemeral: data resets on every redeploy/restart.
    # For persistence use a paid plan + disk, and point the DB paths at it:
    # disk:
    #   name: nova-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # NOVA_DB_PATH=/var/data/nova.db   NOVA_CONTROL_DB_PATH=/var/data/nova_control.db
